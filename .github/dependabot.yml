version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # streamlit pins pyarrow<25, so a pyarrow 25 bump makes the grouped
      # update unresolvable. Drop this entry once streamlit relaxes the cap.
      - dependency-name: pyarrow
        versions: [">=25"]

  - package-ecosystem: npm
    directory: /frontend-react
    schedule:
      interval: monthly
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      # Tailwind v4 is a framework migration, not a version bump: the PostCSS
      # plugin moved to @tailwindcss/postcss, @tailwind directives are replaced
      # by @import, and several utilities were renamed. A green build would not
      # prove the dashboard still renders correctly, so it needs its own PR with
      # a visual review rather than riding along in a grouped update.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
