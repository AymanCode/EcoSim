version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # streamlit pins pyarrow<25, so a pyarrow 25 bump makes the grouped
      # update unresolvable. Drop this entry once streamlit relaxes the cap.
      - dependency-name: pyarrow
        versions: [">=25"]

  - package-ecosystem: npm
    directory: /frontend-react
    schedule:
      interval: monthly
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
