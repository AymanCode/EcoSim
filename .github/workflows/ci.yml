name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend stable checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'backend/requirements.lock') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -c backend/requirements.lock -e ".[dev,ml]"

      - name: Python correctness lint
        run: python -m ruff check .

      - name: Build installable package
        run: pip wheel --no-deps --wheel-dir /tmp/ecosim-wheel .

      - name: Server API contract tests
        run: python -m pytest backend/tests_server -q

      - name: Stable simulation contract tests
        run: python -m pytest backend/tests_contracts -q -m "not llm and not research"

      - name: Warehouse and read API tests
        run: python -m pytest backend/data/tests backend/tests_server/test_server_api.py -q

  forecasting:
    name: Forecasting checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: policy_forecasting/requirements.txt

      - name: Install frozen forecasting dependencies
        run: pip install -r policy_forecasting/requirements.txt

      - name: Forecasting package tests
        run: python -m pytest policy_forecasting/tests -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend-react

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend-react

      - name: Test frontend
        run: npm run test
        working-directory: frontend-react

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend-react

      - name: Build frontend
        run: npm run build
        working-directory: frontend-react
