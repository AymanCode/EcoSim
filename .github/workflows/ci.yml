name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend stable checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.lock

      - name: Install dependencies
        run: pip install -c backend/requirements.lock -e ".[test,ml]"

      - name: Python correctness lint
        run: python -m ruff check .

      - name: Build installable package
        run: pip wheel --no-deps --wheel-dir /tmp/ecosim-wheel .

      - name: Backend tests (contracts, server, warehouse, mocked LLM)
        run: python -m pytest --durations=10

  forecasting:
    name: Forecasting checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: policy_forecasting/requirements.txt

      - name: Install frozen forecasting dependencies
        run: pip install -r policy_forecasting/requirements.txt

      - name: Forecasting package tests
        run: python -m pytest policy_forecasting/tests -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend-react

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend-react

      - name: Test frontend
        run: npm run test
        working-directory: frontend-react

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend-react

      - name: Build frontend
        run: npm run build
        working-directory: frontend-react

  startup:
    name: Fresh Docker startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build and start the documented stack
        run: docker compose up --build -d --wait --wait-timeout 120

      - name: Verify dashboard assets, WebSocket simulation, and SQLite persistence
        run: |
          curl --fail --silent --show-error http://localhost:5173/health
          docker compose exec -T backend python -m backend.tools.integration.smoke_startup --url http://frontend --sqlite-path /app/runtime/ecosim.db

      - name: Show container diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200

      - name: Clean up test containers and test data
        if: always()
        run: docker compose down --volumes
