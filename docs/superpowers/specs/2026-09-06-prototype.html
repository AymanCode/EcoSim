<!DOCTYPE html>
<html lang="en" data-theme="ember">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoSim prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  [data-theme=ember]{--page:#08090B;--panel:#111316;--panel2:#171A1F;--panel3:#1F232A;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
    --ink:#F5F6F7;--ink2:#C2C7CF;--ink3:#8A919C;--ink4:#5B626C;--acc:#FF6B1A;--acc-ink:#1A0A00;--acc-soft:rgba(255,107,26,.14);
    --good:#34D399;--warn:#FFB020;--crit:#E0245E;--ai:#C084FC;--s1:#3987e5;--s2:#199e70;--s3:#9085e9;--s4:#d55181;--grid:#20242B;
    --font:'Barlow';--font-num:'Barlow Semi Condensed';--num-stretch:100%;--mono:'JetBrains Mono';--glow:0px;--hero-w:600;--hero-ls:0}
  [data-theme=paper]{--page:#EDE9E0;--panel:#FBF9F4;--panel2:#F4F0E8;--panel3:#E7E2D7;--line:rgba(20,18,14,.09);--line2:rgba(20,18,14,.18);
    --ink:#14120F;--ink2:#3E3A33;--ink3:#77716A;--ink4:#A39D92;--acc:#D2491E;--acc-ink:#FFFFFF;--acc-soft:rgba(210,73,30,.12);
    --good:#1D8F4E;--warn:#A16207;--crit:#9F1239;--ai:#7C3AED;--s1:#2a78d6;--s2:#1baf7a;--s3:#4a3aa7;--s4:#e87ba4;--grid:#DDD7CB;
    --font:'Barlow';--font-num:'Barlow Semi Condensed';--num-stretch:100%;--mono:'JetBrains Mono';--glow:0px;--hero-w:600;--hero-ls:0}

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--page);color:var(--ink2);font-family:var(--font),system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .25s}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  .mono{font-family:var(--mono),ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .app{display:flex;height:100vh}

  /* rail */
  .rail{width:76px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:2px;background:var(--panel);flex:none}
  .mark{width:38px;height:38px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;color:var(--ink)}
  .mark svg{width:32px;height:32px}
  .wordmark{font-size:11px;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin-bottom:12px}
  .wordmark span{font-weight:400;color:var(--ink3)}
  .nav{width:64px;height:54px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink4);font-size:10px;font-weight:600;position:relative;transition:color .15s,background .15s}
  .nav:hover{color:var(--ink2);background:var(--panel2)}
  .nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .nav.on{color:var(--acc);background:var(--acc-soft)}
  .nav.on::before{content:'';position:absolute;left:-6px;top:15px;bottom:15px;width:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
  .online{margin-top:auto;margin-bottom:64px;font-size:9px;color:var(--good);letter-spacing:.12em;display:flex;flex-direction:column;align-items:center;gap:5px}
  .online i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}

  /* main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:14px;background:var(--panel);flex:none}
  .crumb{font-weight:600;color:var(--ink);font-size:14px}
  .crumb span{color:var(--ink4);font-weight:500}
  .tickbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:8px;padding:4px 10px;background:var(--page)}
  .tickbox .k{font-size:10px;letter-spacing:.12em;color:var(--ink3);font-weight:700}
  .tickbox .v{font-size:16px;font-weight:600;color:var(--acc);font-family:var(--mono);font-variant-numeric:tabular-nums}
  .tickbox .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);animation:blink 1.4s ease-in-out infinite}
  .paused .tickbox .dot{background:var(--warn);box-shadow:0 0 8px var(--warn);animation:none}
  @keyframes blink{50%{opacity:.3}}
  .btn{border:1px solid var(--line2);background:var(--panel2);color:var(--ink2);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
  .btn:hover{background:var(--panel3);border-color:var(--ink4)}
  .btn.primary{border-color:transparent;background:var(--acc);color:var(--acc-ink)}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.big{padding:12px 20px;font-size:14px;border-radius:10px}
  .btn.danger{color:var(--crit)}
  .strip{height:30px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:22px;font-family:var(--mono);font-size:11px;color:var(--ink3);background:var(--panel);flex:none;overflow:hidden;white-space:nowrap}
  .strip b{color:var(--ink2);font-weight:500}
  .strip .sep{width:1px;height:12px;background:var(--line2);flex:none}
  .view{flex:1;overflow:auto;padding:16px 20px 96px;scrollbar-width:thin;scrollbar-color:var(--panel3) transparent}
  .ph{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px;gap:16px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
  .ph h3{font-size:22px;font-weight:700;color:var(--ink);margin:2px 0 0;letter-spacing:-.02em}
  .ph .sum{color:var(--ink3);font-size:12px;margin-top:2px}
  .g12{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .col{display:flex;flex-direction:column;gap:10px}
  .s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s9{grid-column:span 9}.s12{grid-column:span 12}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;position:relative;display:flex;flex-direction:column}
  .panel.hot{border-color:color-mix(in srgb,var(--acc) 35%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 10%,transparent),0 10px 30px rgba(0,0,0,.2)}
  .ttl{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:8px;flex:none}
  .ttl h4{font-size:12px;font-weight:700;color:var(--ink2);margin:0}
  .ttl small{font-size:11px;color:var(--ink4)}
  .lbl{font-size:11px;color:var(--ink3);font-weight:600}
  .muted{color:var(--ink4)}

  /* pills / chips */
  .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;color:var(--ink2);background:var(--panel2);white-space:nowrap}
  .pill i{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--ink3)}
  .pill.good i{background:var(--good);box-shadow:0 0 var(--glow) var(--good)}
  .pill.warn i{background:var(--warn);box-shadow:0 0 var(--glow) var(--warn)}
  .pill.crit i{background:var(--crit);box-shadow:0 0 var(--glow) var(--crit)}
  .pill.ai i{background:var(--ai);box-shadow:0 0 var(--glow) var(--ai)}
  .pill.acc i{background:var(--acc);box-shadow:0 0 var(--glow) var(--acc)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink3);background:transparent}
  .chip:hover{color:var(--ink2);border-color:var(--line2)}
  .chip.on{border-color:color-mix(in srgb,var(--acc) 45%,transparent);color:var(--ink);background:var(--acc-soft)}

  /* tile */
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px 9px;position:relative;overflow:hidden;min-width:0;transition:border-color .3s}
  .tile .l{font-size:11px;color:var(--ink3);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:6px;white-space:nowrap}.tile .l span:first-child{overflow:hidden;text-overflow:ellipsis}
  .tile .v{font-size:27px;font-weight:var(--hero-w);color:var(--ink);letter-spacing:var(--hero-ls);line-height:1.15;margin-top:5px;white-space:nowrap}
  .tile .foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:5px;gap:8px}
  .tile .cap{font-size:11px;color:var(--ink4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile svg[data-spark]{height:22px;width:64px;flex:none}
  .delta{font-family:var(--mono);font-size:10.5px;font-weight:600;border-radius:6px;padding:1px 6px;background:var(--panel2);border:1px solid var(--line);color:var(--ink3);white-space:nowrap}
  .delta.up{color:var(--good)}.delta.down{color:var(--crit)}
  .tile.warn .v{color:var(--warn)}.tile.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
  .tile.crit .v{color:var(--crit)}.tile.crit{border-color:color-mix(in srgb,var(--crit) 55%,transparent)}
  .tile.crit::after{content:'';position:absolute;inset:0;border-radius:10px;box-shadow:inset 0 0 26px color-mix(in srgb,var(--crit) 22%,transparent);animation:pulse 2.4s ease-in-out infinite;pointer-events:none}
  @keyframes pulse{50%{opacity:.25}}
  .tile.flash::before{content:'';position:absolute;inset:0;background:var(--acc-soft);animation:flash .8s ease-out forwards;pointer-events:none}
  @keyframes flash{to{opacity:0}}
  .hero .v{font-size:48px;font-weight:var(--hero-w);color:var(--ink);letter-spacing:var(--hero-ls);line-height:1;margin-top:6px;text-shadow:0 0 calc(var(--glow)*4) color-mix(in srgb,var(--acc) 25%,transparent)}
  .hero .v.good{color:var(--good);text-shadow:0 0 calc(var(--glow)*4) color-mix(in srgb,var(--good) 30%,transparent)}
  .hero .v.crit{color:var(--crit)}
  .hero .meta{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .kpi{display:flex;flex-direction:column}
  .kpi .n{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1.1}
  .kpi .k{font-size:11px;color:var(--ink3);font-weight:600}

  /* charts */
  .chart{position:relative;width:100%;flex:1;min-height:0}
  .chart svg{display:block;width:100%;height:100%;overflow:visible}
  .chart .tip{position:absolute;pointer-events:none;background:var(--panel3);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;font-family:var(--mono);font-size:11px;color:var(--ink);white-space:nowrap;display:none;z-index:5;box-shadow:0 8px 20px rgba(0,0,0,.25);line-height:1.5}
  .axis text{font-family:var(--mono),monospace;font-size:10px;fill:var(--ink4)}
  .axis line{stroke:var(--grid);stroke-width:1}
  .endlab{font-family:var(--font),sans-serif;font-size:11px;font-weight:700;fill:var(--ink)}
  .endsub{font-family:var(--mono),monospace;font-size:10px;fill:var(--ink3)}
  .mk text{font-family:var(--font),sans-serif;font-size:10px;fill:var(--ai);font-weight:700}
  .glow{filter:drop-shadow(0 0 var(--glow) currentColor)}
  @keyframes draw{to{stroke-dashoffset:0}}
  .draw{stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 1.4s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes fadein{to{opacity:1}}
  .fill{opacity:0;animation:fadein .7s .7s forwards}
  .enddot{animation:beat 1.6s ease-in-out infinite}
  @keyframes beat{50%{r:6.5}}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--ink3);flex-wrap:wrap}
  .legend i{width:10px;height:3px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}

  /* gauges/bars */
  .gauge{display:flex;flex-direction:column;align-items:center;flex:none}.gauge.big{margin:6px auto 0}
  .gauge svg{width:96px;height:58px;overflow:visible}
  .gauge.big svg{width:200px;height:118px}
  .gauge .gv{font-size:20px;font-weight:700;color:var(--ink);margin-top:-22px;letter-spacing:-.02em}
  .gauge.big .gv{font-size:44px;margin-top:-58px;letter-spacing:-.03em}
  .gauge .gl{font-size:10px;color:var(--ink3);font-weight:600;margin-top:2px}
  .bar{display:grid;grid-template-columns:78px 1fr 44px;align-items:center;gap:8px;font-size:11px;color:var(--ink3);padding:3px 0}
  .bar .tr{height:7px;border-radius:3px;background:var(--panel3);overflow:hidden}
  .bar .fl{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
  .bar .nv{font-family:var(--mono);color:var(--ink2);text-align:right;font-size:11px}
  .canvas-slot{border:1px dashed var(--line2);border-radius:10px;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--s1) 12%,transparent),transparent 65%);display:flex;align-items:center;justify-content:center;color:var(--ink4);font-size:10px;text-align:center;line-height:1.4;padding:8px}

  /* rows / lists / tables */
  .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px;gap:10px}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--ink3)}
  .row .n{font-family:var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
  .sig{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
  .sig:last-child{border-bottom:0}
  .sig .rail-b{width:3px;align-self:stretch;border-radius:2px;flex:none}
  .sig .t{font-weight:700;color:var(--ink);font-size:12px}
  .sig .d{color:var(--ink3);font-size:11px;margin-top:1px}
  .sig .when{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink4);white-space:nowrap}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;font-size:10.5px;font-weight:700;color:var(--ink4);padding:6px 8px;border-bottom:1px solid var(--line2);cursor:pointer;user-select:none;white-space:nowrap}
  th.ar,td.ar{text-align:right}
  td{padding:7px 8px;border-bottom:1px solid var(--line);color:var(--ink2);white-space:nowrap}
  td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
  tr.sel td{background:var(--acc-soft)}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:var(--panel2)}
  .ibar{display:inline-block;height:6px;border-radius:3px;background:var(--acc);vertical-align:middle;margin-right:6px;opacity:.85}

  /* roster */
  .roster{display:flex;flex-direction:column;gap:3px;flex:1;min-height:0;max-height:560px;overflow:auto}
  .r{display:grid;grid-template-columns:8px 1fr auto 56px;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;border:1px solid transparent;cursor:pointer}
  .r:hover{background:var(--panel2)}
  .r.on{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 35%,transparent)}
  .r .st{width:8px;height:8px;border-radius:50%}
  .r .nm{font-weight:700;color:var(--ink);font-size:12px}
  .r .em{font-size:10px;color:var(--ink4)}
  .r .cash{font-family:var(--mono);font-size:11px;color:var(--ink2);text-align:right}
  .r svg{width:56px;height:18px}
  .search{border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--ink4);background:var(--page);margin-bottom:8px}

  /* inputs */
  .field{margin-bottom:14px}
  .field .fh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .field .fh label{font-size:12px;font-weight:600;color:var(--ink2)}
  .field .fh .val{font-family:var(--mono);font-size:12px;color:var(--acc);background:var(--acc-soft);border-radius:6px;padding:1px 7px}
  .field .desc{font-size:11px;color:var(--ink4);margin-top:4px}
  input[type=range]{-webkit-appearance:none;width:100%;height:18px;background:transparent;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:linear-gradient(to right,var(--acc) var(--p,50%),var(--panel3) var(--p,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--acc);border:2px solid var(--panel);margin-top:-5px;box-shadow:0 0 var(--glow) var(--acc)}
  .select{border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--ink);background:var(--page);display:flex;justify-content:space-between}
  .toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--page)}
  .toggle .tl{font-size:12px;font-weight:600;color:var(--ink)}
  .toggle .td{font-size:10.5px;color:var(--ink4)}
  .sw{width:34px;height:20px;border-radius:999px;background:var(--panel3);position:relative;flex:none;transition:background .2s}
  .sw::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--ink3);transition:transform .2s,background .2s}
  .toggle.on .sw{background:var(--acc)}.toggle.on .sw::after{transform:translateX(14px);background:var(--acc-ink)}
  .check{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}
  .check:last-child{border-bottom:0}
  .check i{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--acc-ink);background:var(--good);flex:none}
  .check .ck{color:var(--ink);font-weight:600}.check .cd{color:var(--ink4);font-size:11px;margin-left:auto;font-family:var(--mono)}

  /* ticker */
  .ticker{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:10px;height:30px;display:flex;align-items:center;position:relative}
  .ticker .lbl{position:absolute;left:0;top:0;bottom:0;padding:0 10px;display:flex;align-items:center;background:var(--panel);z-index:2;font-size:10px;letter-spacing:.1em;color:var(--acc);font-weight:800;border-right:1px solid var(--line)}
  .ticker .track{display:flex;gap:34px;white-space:nowrap;animation:tick 60s linear infinite;padding-left:80px;font-family:var(--mono);font-size:11px;color:var(--ink3)}
  .ticker .track b{color:var(--ink);font-weight:600;margin-left:6px}
  .ticker .track .up{color:var(--good)}.ticker .track .dn{color:var(--crit)}
  @keyframes tick{to{transform:translateX(-50%)}}

  /* timeline */
  .tl-item{display:grid;grid-template-columns:52px 14px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:start}
  .tl-item:last-child{border-bottom:0}
  .tl-item .tt{font-family:var(--mono);font-size:10.5px;color:var(--ink4);padding-top:3px}
  .tl-item .dot{width:10px;height:10px;border-radius:50%;margin-top:5px;border:2px solid var(--panel)}
  .tl-item .tb{font-size:12px;color:var(--ink);font-weight:700}
  .tl-item .tr{font-size:11px;color:var(--ink3);margin-top:2px}
  .ba{display:flex;gap:8px;flex-wrap:wrap}
  .ba .b{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--page);min-width:112px}
  .ba .b .k{font-size:10px;color:var(--ink4);font-weight:600}
  .ba .b .v{font-family:var(--mono);font-size:12px;color:var(--ink);margin-top:2px}
  .ba .b .v .arrow{color:var(--ink4);margin:0 4px}

  /* logs */
  .logwrap{max-height:calc(100vh - 300px);overflow:auto;scrollbar-width:thin}
  tr.sev-warning td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
  tr.sev-error td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
  tr.sev-info td:first-child{box-shadow:inset 3px 0 0 var(--line2)}
  .json{font-family:var(--mono);font-size:11px;background:var(--page);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink3);white-space:pre;overflow:auto;line-height:1.5}
  .json b{color:var(--acc);font-weight:500}.json i{color:var(--ink);font-style:normal}

  /* tray */

    const cs=document.getElementById('cmdsum');if(cs)cs.textContent='GDP '+F.money(cur('gdp'))+' this tick, unemployment '+F.pct1(cur('unemp'))+', fiscal balance '+F.moneyS(cur('profit'))+'.';
    const fs=document.getElementById('finsum');if(fs)fs.textContent=(cur('profit')>=0?'Revenue is covering outlays this tick.':'Outlays exceed revenue this tick.')+' Treasury debt has been flat for 190 ticks.';
    const tk=document.getElementById('ticker');if(tk){const items=[['GDP','gdp','money'],['Unemployment','unemp','pct1'],['Wage','wage','usd2'],['Happiness','happy','dec1'],['Fiscal','profit','moneyS'],['Gini','gini','dec3'],['Food','price.food','usd2'],['Housing','price.housing','usd2'],['Firms','firms','int'],['Tick time','tickms','ms']].map(x=>{const d=cur(x[1])-back(x[1],1);return '<span>'+x[0]+'<b>'+F[x[2]](cur(x[1]))+'</b> <span class="'+(d>=0?'up':'dn')+'">'+(d>=0?'▲':'▼')+'</span></span>'}).join('');tk.innerHTML=items+items}
    const sg=document.getElementById('signals');if(sg)sg.innerHTML=sig(cur('unemp')>25?'warn':'good','Unemployment '+F.pct1(cur('unemp')),cur('unemp')>25?'Above the 25% threshold. Public works active since t202.':'Labour market pressure contained.','t'+S.tick)+sig(cur('profit')<0?'crit':'good','Fiscal balance '+F.moneyS(cur('profit')),cur('profit')<0?'Outlays exceed revenue this tick.':'Surplus for '+(S.tick-96)+' ticks since the wage-tax change.','t'+S.tick)+sig('ai','Assistant rejected at t240','Profit tax proposal exceeded the two-instrument window.','t240')+sig(cur('struggling')>=3?'warn':'good',Math.round(cur('struggling'))+' firms struggling','Cash below $2,000. Food sector carries most of it.','t'+S.tick);
    const gp=document.getElementById('ginipill');if(gp){const g=cur('gini');gp.className='pill '+(g>.6?'crit':g>.45?'warn':'good');gp.innerHTML='<i></i>'+(g>.6?'High inequality':g>.45?'Elevated inequality':'Moderate inequality')}
    document.getElementById('strip').innerHTML='<span>session <b>d9b78c2e</b></span><span class="sep"></span><span>compute <b>'+cur('tickms').toFixed(0)+' ms</b>/tick</span><span class="sep"></span><span>households <b>1,000</b></span><span class="sep"></span><span>firms <b>'+Math.round(cur('firms'))+'</b></span><span class="sep"></span><span>unemployment <b>'+F.pct1(cur('unemp'))+'</b></span><span class="sep"></span><span>policy <b>manual + assistant</b></span><span style="margin-left:auto">last change <b>t'+POL[POL.length-1].t+'</b> · '+POL[POL.length-1].label+'</span>';
  }

  // ---------- tick engine ----------
  function step(){S.tick++;for(const k in GEN){const [,d,v,m]=GEN[k];const a=H[k];a.push(Math.max(m,a[a.length-1]+d+(rnd()-.5)*v));a.shift()}
    HH.forEach(h=>{h.cash=Math.max(0,h.cash+(h.wage*.35-9)*(.5+rnd()));h.hist.cash.push(h.cash);h.hist.cash.shift();h.hist.wage.push(h.wage);h.hist.wage.shift()});
    FIRMS.forEach(f=>{f.cash+=f.profit*(.6+rnd()*.8);f.hist.cash.push(f.cash);f.hist.cash.shift();f.hist.profit.push(f.profit*(.5+rnd()));f.hist.profit.shift()});
    const added=[mkLog(S.tick)];if(rnd()<.45)added.push(mkLog(S.tick));LOGS.push(...added);if(LOGS.length>400)LOGS.splice(0,LOGS.length-400);
    if(S.tick===280){POL.push({t:280,key:'benefit_level',label:'Benefit level: neutral → generous',prev:'Neutral',value:'Generous',by:'ai',ok:true,why:'Happiness below 30 for 60 ticks; the surplus can absorb higher transfers.'});LEVERS[1].items[0][2]='Generous';H.out.forEach((v,i)=>{if(i>H.out.length-2)H.out[i]+=1200});GEN.out[0]+=1200}
    if(S.view==='logs'){const body=document.getElementById('logbody');if(body){added.filter(l=>S.logFilter==='All'||l.type===S.logFilter).forEach(l=>body.insertAdjacentHTML('beforeend',logRow(l,0,false)));const w=document.getElementById('logwrap');w.scrollTop=w.scrollHeight;const c=document.getElementById('evcount');if(c)c.textContent=LOGS.length}}}
  setInterval(()=>{if(!S.running)return;step();refresh(false)},900);

  // ---------- boot ----------
  const q=new URLSearchParams(location.hash.slice(1));if(q.get('view'))S.view=q.get('view');if(q.get('theme'))S.theme=q.get('theme')==='paper'?'paper':'ember';S.logo=1;if(q.get('paused')){S.running=false;document.body.classList.add('paused')}
  document.documentElement.dataset.theme=S.theme;renderMark();render();
  window.addEventListener('resize',()=>mount(false));
})();
</script>
